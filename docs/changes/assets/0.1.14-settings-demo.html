<!doctype html><html lang="zh"><meta charset="utf-8"><title>栏况 0.1.12 卡片样稿</title>
<style>
:root{--bg:#2a2a2c;--fg:#f2f2f4;--sec:#9a9aa0;--sep:#48484c;--acc:#3b82f6;--red:#ef4444;--green:#30b04a}
body{margin:0;background:#1b1b1d;font:13px -apple-system,"PingFang SC",sans-serif;color:var(--fg);display:flex;gap:28px;padding:24px;flex-wrap:wrap}
.panel{width:260px;background:var(--bg);border-radius:10px;box-shadow:0 8px 24px #0008;overflow:hidden;position:relative}
.track{display:flex;transition:transform .25s ease}
.card{flex:0 0 260px;box-sizing:border-box;padding:10px 12px 0;height:146px}
.row{display:flex;align-items:center;height:22px;margin-bottom:4px}.row:last-child{margin-bottom:0}
.ring{width:14px;height:14px;margin-right:8px;flex:none}.lab{color:var(--sec)}.val{margin-left:auto;font-variant-numeric:tabular-nums}
.title{display:flex;align-items:center;height:18px}.btn{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;background:#ffffff14;color:var(--fg);font-size:12px;cursor:pointer}.btn:hover{background:#ffffff26}.set{height:100%;overflow-y:auto}.srow{display:flex;align-items:center;height:30px;border-bottom:1px solid var(--sep)}.srow:last-child{border:0}.sw{margin-left:auto;width:32px;height:18px;border-radius:9px;background:var(--acc);position:relative}.sw:after{content:'';position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:7px;background:#fff}.title b{font-weight:600}.title span{margin-left:auto;font-variant-numeric:tabular-nums}
.chart{margin-top:6px;height:86px;border:1px solid var(--sep);border-radius:4px;overflow:hidden}
.stats{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--sec);font-variant-numeric:tabular-nums}.stats i{font-style:normal;color:var(--fg)}
.big{display:flex;align-items:center;justify-content:center;gap:14px;height:calc(100% - 18px)}
.dots{height:14px;display:flex;justify-content:center;align-items:center;gap:6px;padding-bottom:6px}
.dot{width:6px;height:6px;border-radius:3px;background:#ffffff40}.dot.on{background:#fff}
.cap{width:100%;color:#888;font-size:12px}
</style>
<div class="cap">样稿：在面板上用触摸板左右滑或滚动鼠标滚轮切换卡片，一次一张，到头不循环。右边是没有电池的 Mac。</div>
<div id="a"></div><div id="b"></div>
<script>
const H=60, mem=[],cu=[],cs=[];let t=0;
function ring(p){const r=6,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 14 14"><circle cx="7" cy="7" r="${r}" fill="none" stroke="var(--sep)" stroke-width="2"/><circle cx="7" cy="7" r="${r}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 7 7)"/></svg>`}
const arrows=`<svg class="ring" viewBox="0 0 14 14" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linecap="round"><path d="M4.5 12V2M2 4.5l2.5-2.5L7 4.5M9.5 2v10M7 9.5l2.5 2.5L12 9.5"/></svg>`;
function area(arr,color,base){if(!arr.length)return'';const w=234,h=86,dx=w/(H-1);let d=`M${w-(arr.length-1)*dx},${h}`;arr.forEach((v,i)=>{const y=h-(v+(base?base[i]:0))/100*h;d+=` L${w-(arr.length-1-i)*dx},${y.toFixed(1)}`});d+=` L${w},${h}Z`;return `<path d="${d}" fill="${color}" fill-opacity=".55" stroke="${color}" stroke-width="1"/>`}
function render(el,bat){const m=mem.at(-1),u=cu.at(-1),s=cs.at(-1);
const rows=[[ring(m),'内存',`13 / 16 G · ${m}%`],[ring(u+s),'CPU',`${u+s}%`],[ring(95),'磁盘','948 / 1000 G · 95%'],[arrows,'网络','↑ 6.4 KB/s · ↓ 11 KB/s']];
if(bat)rows.push([ring(82),'电池','82% · 充电中']);
const n=rows.length,hgt=n*22+(n-1)*4+10+24+6;
const gear=`<span class="btn" onclick="go(this,-1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>设置</span>`;
const cards=[`<div class="card"><div class="title" style="margin-bottom:6px"><b>总览</b>${gear}</div>${rows.map(r=>`<div class="row">${r[0]}<span class="lab">${r[1]}</span><span class="val">${r[2]}</span></div>`).join('')}</div>`,
`<div class="card"><div class="title"><b>内存</b><span>13.4 / 16 G · ${m}%</span></div><div class="chart"><svg width="234" height="86">${area(mem,'var(--green)')}</svg></div><div class="stats"><span>已使用 <i>13.4 G</i></span><span>已缓存 <i>2.7 G</i></span><span>交换 <i>11.0 G</i></span></div></div>`,
`<div class="card"><div class="title"><b>CPU</b><span>${u+s}%</span></div><div class="chart"><svg width="234" height="86">${area(cs.map((v,i)=>v+cu[i]),'var(--acc)')}${area(cs,'var(--red)')}</svg></div><div class="stats"><span>系统 <i style="color:var(--red)">${s}%</i></span><span>用户 <i style="color:var(--acc)">${u}%</i></span><span>闲置 <i>${100-u-s}%</i></span></div></div>`,
`<div class="card"><div class="title"><b>磁盘</b><span>95%</span></div><div class="big"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="28" fill="none" stroke="var(--sep)" stroke-width="12"/><circle cx="36" cy="36" r="28" fill="none" stroke="var(--acc)" stroke-width="12" stroke-dasharray="${2*Math.PI*28*.948} 999" transform="rotate(-90 36 36)"/></svg><div><div>已用 948 G</div><div class="lab">可用 52 G</div><div class="lab">共 1000 G</div></div></div></div>`,
`<div class="card"><div class="title"><b>网络</b></div><div class="big" style="gap:8px;align-items:center"><div style="flex:1;box-sizing:border-box;border-radius:8px;background:#f59e0b14;border:1px solid #f59e0b33;padding:10px"><div style="display:flex;align-items:center;gap:6px"><div style="width:22px;height:22px;border-radius:11px;background:#f59e0b33;display:flex;align-items:center;justify-content:center;color:#f59e0b;font-size:13px;font-weight:600">↑</div><span style="color:var(--sec);font-size:11px">上传</span></div><div style="height:6px"></div><div style="font-variant-numeric:tabular-nums"><span style="font-size:20px;font-weight:600">6.4</span> <span style="font-size:11px;color:var(--sec)">KB/s</span></div></div><div style="flex:1;box-sizing:border-box;border-radius:8px;background:#3b82f614;border:1px solid #3b82f633;padding:10px"><div style="display:flex;align-items:center;gap:6px"><div style="width:22px;height:22px;border-radius:11px;background:#3b82f633;display:flex;align-items:center;justify-content:center;color:#3b82f6;font-size:13px;font-weight:600">↓</div><span style="color:var(--sec);font-size:11px">下载</span></div><div style="height:6px"></div><div style="font-variant-numeric:tabular-nums"><span style="font-size:20px;font-weight:600">11</span> <span style="font-size:11px;color:var(--sec)">KB/s</span></div></div></div></div>`];
if(bat)cards.push(`<div class="card"><div class="title"><b>电池</b><span>充电中</span></div><div class="big"><svg width="112" height="56" viewBox="0 0 112 56"><rect x="1" y="1" width="100" height="54" rx="9" fill="none" stroke="var(--fg)" stroke-width="2"/><rect x="104" y="18" width="6" height="20" rx="2" fill="var(--fg)"/><rect x="6" y="6" width="${90*.82}" height="44" rx="5" fill="var(--green)"/><path d="M52 12l-10 18h9l-3 14 12-20h-9z" fill="#fff" stroke="var(--bg)" stroke-width="1.5"/></svg><div style="font-size:24px;font-variant-numeric:tabular-nums">82%</div></div></div>`);
if(!el.p){el.p=0;el.innerHTML=`<div class="panel"><div class="track"></div><div class="dots"></div></div>`;
 let lock=0,acc=0;el.querySelector('.panel').addEventListener('wheel',e=>{e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(el.p<0)return;if(Date.now()<lock){return}acc+=d;if(Math.abs(acc)>30){el.p=Math.max(0,Math.min(el.n-1,el.p+(acc>0?1:-1)));acc=0;lock=Date.now()+450;render(el,bat)}},{passive:false});}
const settings=`<div class="card"><div class="title" style="margin-bottom:4px"><span class="btn" style="margin-left:0" onclick="go(this,0)">‹ 返回</span><b style="margin-left:8px">设置</b></div><div class="set"><div class="srow"><span>开机自启动</span><span class="sw"></span></div><div class="srow"><span>版本</span><span class="val" style="color:var(--sec)">0.1.13</span></div><div class="srow"><span>更新</span><span class="btn">检查更新</span></div></div></div>`;
el.n=cards.length;cards.push(settings);const tr=el.querySelector('.track');tr.innerHTML=cards.join('');tr.querySelectorAll('.card').forEach(c=>c.style.height=hgt+'px');const P=el.p<0?cards.length-1:el.p;tr.style.transform=`translateX(${-P*260}px)`;
el.querySelector('.dots').style.visibility=el.p<0?'hidden':'visible';el.querySelector('.dots').innerHTML=cards.slice(0,el.n).map((_,i)=>`<div class="dot ${i==el.p?'on':''}"></div>`).join('');}
window.go=(b,p)=>{const el=b.closest('#a,#b');el.p=p;render(el,el.id=='a')};
function tick(){t++;mem.push(Math.round(80+3*Math.sin(t/9)));cs.push(Math.round(4+3*Math.abs(Math.sin(t/3))));cu.push(Math.round(7+6*Math.abs(Math.sin(t/5+1))));[mem,cs,cu].forEach(a=>a.length>H&&a.shift());render(A,true);render(B,false)}
const A=document.getElementById('a'),B=document.getElementById('b');const q=new URLSearchParams(location.search);for(let i=0;i<60;i++)tick();if(q.get('p')){A.p=+q.get('p');B.p=A.p<0?-1:Math.min(A.p,4);render(A,true);render(B,false)}if(!q.get('p'))setInterval(tick,1000);
</script></html>
