name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build universal app and publish
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Load project.env
        shell: bash
        run: |
          set -euo pipefail
          source ./project.env
          {
            echo "NAME=$NAME"
            echo "DISPLAY_NAME=$DISPLAY_NAME"
            echo "VERSION=${TAG#v}"
          } >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Unit tests
        shell: bash
        run: |
          set -uo pipefail
          swift test 2>&1 | tee /tmp/tests.log
          status=${PIPESTATUS[0]}
          echo "RELEASE: $(grep -E 'Executed [0-9]+ tests' /tmp/tests.log | tail -n 1)"
          exit "$status"

      - name: Build universal app, dmg, zip
        run: scripts/build.sh "$VERSION"

      - name: Verify archs, signature, bundle
        shell: bash
        run: |
          set -euo pipefail
          app="build/${NAME}.app"
          bin="$app/Contents/MacOS/$NAME"
          archs=$(lipo -archs "$bin"); echo "RELEASE: lipo=$archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          fw="$app/Contents/Frameworks/Sparkle.framework/Sparkle"
          echo "RELEASE: sparkle archs=$(lipo -archs "$fw")"
          codesign -dv --verbose=2 "$app" 2>&1 | tee /tmp/codesign.log
          grep -q "Signature=adhoc" /tmp/codesign.log
          if grep -q "runtime" /tmp/codesign.log; then echo "::error::不应开启 hardened runtime"; exit 1; fi
          otool -L "$bin" | grep -q "@rpath/Sparkle.framework"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" | grep -qx "$VERSION"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$app/Contents/Info.plist" | grep -qx "AppIcon"
          echo "RELEASE: icon=AppIcon.icns $(stat -f%z "$app/Contents/Resources/AppIcon.icns")B"
          echo "RELEASE: codesign=adhoc version=$VERSION"

      - name: Smoke test (arm64 native + x86_64 Rosetta)
        shell: bash
        run: |
          set -euo pipefail
          bin="build/${NAME}.app/Contents/MacOS/$NAME"
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          for a in arm64 x86_64; do
            arch -"$a" "$bin" >"/tmp/smoke-$a.log" 2>&1 &
            pid=$!
            sleep 8
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::$a 进程 8 秒内退出"; cat "/tmp/smoke-$a.log"; exit 1
            fi
            kill -TERM "$pid" || true; sleep 1; kill -KILL "$pid" 2>/dev/null || true
            echo "RELEASE: smoke=$a alive 8s"
          done

      - name: Idle footprint (C6, arm64, 60s)
        run: scripts/ci_idle_check.sh

      - name: Screenshots and panel layout check
        run: scripts/ci_screenshots.sh

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          if-no-files-found: warn
          path: shots/

      - name: Sign zip and generate appcast.xml
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/appcast.sh "$VERSION"

      - name: Check appcast.xml
        run: scripts/check_appcast.sh dist/appcast.xml

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/notes.py md "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.DISPLAY_NAME }} ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/${{ env.NAME }}-*-mac-universal.dmg
            dist/${{ env.NAME }}-*-mac-universal.zip
            dist/${{ env.NAME }}-*-mac-universal.zip.sha256
            dist/appcast.xml
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
